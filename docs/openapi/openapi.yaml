                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/redis/keys/delete:
    post:
      tags: [Storage]
      summary: Delete multiple Redis keys
      operationId: deleteStorageRedisKeys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    minLength: 1
      responses:
        '200':
          description: Batch Redis key deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/redis/worker-affinity:
    get:
      tags: [Storage]
      summary: Inspect Redis worker affinity
      operationId: getStorageRedisWorkerAffinity
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
        - name: ownerWorkerId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Worker affinity diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/redis/workspace-placements:
    get:
      tags: [Storage]
      summary: List Redis workspace placements
      operationId: listStorageRedisWorkspacePlacements
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
        - name: ownerWorkerId
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [unassigned, active, idle, draining, evicted]
      responses:
        '200':
          description: Workspace placement page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/redis/session-queue/clear:
    post:
      tags: [Storage]
      summary: Clear a Redis session queue key
      operationId: clearStorageRedisSessionQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageRedisMaintenanceRequest'
      responses:
        '200':
          description: Maintenance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/redis/session-lock/release:
    post:
      tags: [Storage]
      summary: Release a Redis session lock key
      operationId: releaseStorageRedisSessionLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageRedisMaintenanceRequest'
      responses:
        '200':
          description: Maintenance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    TerminalId:
      name: terminalId
      in: path
      required: true
      schema:
        type: string
    ActionName:
      name: actionName
      in: path
      required: true
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    MessageDirection:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [forward, backward]
        default: forward
    MessageView:
      name: view
      in: query
      required: false
      schema:
        type: string
        enum: [stored, transcript]
        default: stored
      description: >
        `stored` returns persisted Message records. `transcript` returns API
        Message records after transcript projection and includes projection
        metadata such as projectedView and projectedSourceMessageIds.
    MessagesBefore:
      name: before
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 20
    MessagesAfter:
      name: after
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 20
    DirectoryPathQuery:
      name: path
      in: query
      required: false
      schema:
        type: string
        default: /workspace
    EntryPathQuery:
      name: path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    UploadOverwrite:
      name: overwrite
      in: query
      required: false
      schema:
        type: boolean
        default: true
    UploadIfMatch:
      name: ifMatch
      in: query
      required: false
      schema:
        type: string
      description: Optimistic concurrency token. When provided, upload only succeeds if the current file etag matches.
    UploadMtimeMs:
      name: mtimeMs
      in: query
      required: false
      schema:
        type: number
        minimum: 0
      description: Optional modification timestamp in milliseconds to preserve for the uploaded file.
    EntrySortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [name, updatedAt, sizeBytes, type]
        default: name
    SortOrder:
      name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Recursive:
      name: recursive
      in: query
      required: false
      schema:
        type: boolean
        default: false
    FileEncoding:
      name: encoding
      in: query
      required: false
      schema:
        type: string
        enum: [utf8, base64]
        default: utf8
    MaxBytes:
      name: maxBytes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    RunIdQuery:
      name: runId
      in: query
      required: false
      schema:
        type: string
    SelectedRunId:
      name: selectedRunId
      in: query
      required: false
      schema:
        type: string
    MaxTerminalBytes:
      name: maxBytes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1024
        maximum: 1048576
        default: 262144
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Timestamp:
      type: string
      format: date-time
    JsonObject:
      type: object
      additionalProperties: true
    WorkerMode:
      type: string
      enum: [embedded, external, disabled]
    WorkerProcessKind:
      type: string
      enum: [embedded, standalone]
    WorkerState:
      type: string
      enum: [starting, idle, busy, stopping]
    WorkerHealth:
      type: string
      enum: [healthy, late]
    HealthCheckStatus:
      type: string
      enum: [up, down, not_configured]
    RuntimeProcess:
      type: object
      required: [mode, label, execution]
      properties:
        mode:
          type: string
          enum: [api_embedded_worker, api_only, standalone_worker]
        label:
          type: string
          enum: ["API + embedded worker", "API only", "standalone worker"]
        execution:
          type: string
          enum: [redis_queue, local_inline, none]
      additionalProperties: false
    HealthStorage:
      type: object
      required: [primary, events, runQueue]
      properties:
        primary:
          type: string
          enum: [postgres, sqlite]
        events:
          type: string
          enum: [redis, memory]
        runQueue:
          type: string
          enum: [redis, in_process]
      additionalProperties: false
    WorkerLease:
      type: object
      required:
        - workerId
        - processKind
        - state
        - lastSeenAt
        - leaseTtlMs
        - expiresAt
        - lastSeenAgeMs
        - health
      properties:
        workerId:
          type: string
        processKind:
          $ref: '#/components/schemas/WorkerProcessKind'
        state:
          $ref: '#/components/schemas/WorkerState'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        leaseTtlMs:
          type: integer
          minimum: 0
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAgeMs:
          type: integer
          minimum: 0
        health:
          $ref: '#/components/schemas/WorkerHealth'
        currentSessionId:
          type: string
        currentRunId:
          type: string
        currentWorkspaceId:
          type: string
      additionalProperties: false
    WorkerSlot:
      type: object
      required: [slotId, workerId, processKind, state]
      properties:
        slotId:
          type: string
        workerId:
          type: string
        processKind:
          $ref: '#/components/schemas/WorkerProcessKind'
        state:
          $ref: '#/components/schemas/WorkerState'
        currentSessionId:
          type: string
        currentRunId:
          type: string
        currentWorkspaceId:
          type: string
      additionalProperties: false
    WorkerSummary:
      type: object
      required: [active, healthy, late, busy, embedded, standalone]
      properties:
        active:
          type: integer
          minimum: 0
        healthy:
          type: integer
          minimum: 0
        late:
          type: integer
          minimum: 0
        busy:
          type: integer
          minimum: 0
        embedded:
          type: integer
          minimum: 0
        standalone:
          type: integer
          minimum: 0
      additionalProperties: false
    WorkerPoolDecisionReason:
      type: string
      enum: [startup, steady, scale_up, scale_down, cooldown_hold, shutdown]
    WorkerPoolDecision:
      type: object
      required: [timestamp, reason, suggestedWorkers, desiredWorkers, activeWorkers]
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        reason:
          $ref: '#/components/schemas/WorkerPoolDecisionReason'
        suggestedWorkers:
          type: integer
          minimum: 0
        globalSuggestedWorkers:
          type: integer
          minimum: 0
        reservedSubagentCapacity:
          type: integer
          minimum: 0
        reservedWorkers:
          type: integer
          minimum: 0
        availableIdleCapacity:
          type: integer
          minimum: 0
        readySessionsPerActiveWorker:
          type: number
          minimum: 0
        subagentReserveTarget:
          type: integer
          minimum: 0
        subagentReserveDeficit:
          type: integer
          minimum: 0
        desiredWorkers:
          type: integer
          minimum: 0
        activeWorkers:
          type: integer
          minimum: 0
        busyWorkers:
          type: integer
          minimum: 0
        globalActiveWorkers:
          type: integer
          minimum: 0
        globalBusyWorkers:
          type: integer
          minimum: 0
        remoteActiveWorkers:
          type: integer
          minimum: 0
        remoteBusyWorkers:
          type: integer
          minimum: 0
        readySessionCount:
          type: integer
          minimum: 0
        readyQueueDepth:
          type: integer
          minimum: 0
        uniqueReadySessionCount:
          type: integer
          minimum: 0
        subagentReadySessionCount:
          type: integer
          minimum: 0
        subagentReadyQueueDepth:
          type: integer
          minimum: 0
        lockedReadySessionCount:
          type: integer
          minimum: 0
        staleReadySessionCount:
          type: integer
          minimum: 0
        oldestSchedulableReadyAgeMs:
          type: integer
          minimum: 0
      additionalProperties: false
    WorkerPool:
      type: object
      required:
        - running
        - processKind
        - sessionSerialBoundary
        - minWorkers
        - maxWorkers
        - suggestedWorkers
        - reservedSubagentCapacity
        - availableIdleCapacity
        - subagentReserveTarget
        - subagentReserveDeficit
        - desiredWorkers
        - slotCapacity
        - slots
        - activeWorkers
        - busySlots
        - idleSlots
        - busyWorkers
        - idleWorkers
        - readySessionsPerCapacityUnit
        - scaleIntervalMs
        - scaleUpCooldownMs
        - scaleDownCooldownMs
        - scaleUpSampleSize
        - scaleDownSampleSize
        - scaleUpBusyRatioThreshold
        - scaleUpMaxReadyAgeMs
        - scaleUpPressureStreak
        - scaleDownPressureStreak
        - scaleUpCooldownRemainingMs
        - scaleDownCooldownRemainingMs
        - recentDecisions
      properties:
        running:
          type: boolean
        processKind:
          $ref: '#/components/schemas/WorkerProcessKind'
        sessionSerialBoundary:
          type: string
          enum: [session]
        minWorkers:
          type: integer
          minimum: 0
        maxWorkers:
          type: integer
          minimum: 0
        suggestedWorkers:
          type: integer
          minimum: 0
        globalSuggestedWorkers:
          type: integer
          minimum: 0
        reservedSubagentCapacity:
          type: integer
          minimum: 0
        reservedWorkers:
          type: integer
          minimum: 0
        availableIdleCapacity:
          type: integer
          minimum: 0
        readySessionsPerActiveWorker:
          type: number
          minimum: 0
        subagentReserveTarget:
          type: integer
          minimum: 0
        subagentReserveDeficit:
          type: integer
          minimum: 0
        desiredWorkers:
          type: integer
          minimum: 0
        slotCapacity:
          type: integer
          minimum: 0
        slots:
          type: array
          items:
            $ref: '#/components/schemas/WorkerSlot'
        activeWorkers:
          type: integer
          minimum: 0
        busySlots:
          type: integer
          minimum: 0
        idleSlots:
          type: integer
          minimum: 0
        busyWorkers:
          type: integer
          minimum: 0
        idleWorkers:
          type: integer
          minimum: 0
        globalActiveWorkers:
          type: integer
          minimum: 0
        globalBusyWorkers:
          type: integer
          minimum: 0
        remoteActiveWorkers:
          type: integer
          minimum: 0
        remoteBusyWorkers:
          type: integer
          minimum: 0
        readySessionsPerCapacityUnit:
          type: integer
          minimum: 1
          description: Primary queue-density target per observed capacity unit.
        scaleIntervalMs:
          type: integer
          minimum: 0
        scaleUpCooldownMs:
          type: integer
          minimum: 0
        scaleDownCooldownMs:
          type: integer
          minimum: 0
        scaleUpSampleSize:
          type: integer
          minimum: 1
        scaleDownSampleSize:
          type: integer
          minimum: 1
        scaleUpBusyRatioThreshold:
          type: number
          minimum: 0
          maximum: 1
        scaleUpMaxReadyAgeMs:
          type: integer
          minimum: 0
        readySessionCount:
          type: integer
          minimum: 0
        readyQueueDepth:
          type: integer
          minimum: 0
        uniqueReadySessionCount:
          type: integer
          minimum: 0
        subagentReadySessionCount:
          type: integer
          minimum: 0
        subagentReadyQueueDepth:
          type: integer
          minimum: 0
        lockedReadySessionCount:
          type: integer
          minimum: 0
        staleReadySessionCount:
          type: integer
          minimum: 0
        oldestSchedulableReadyAgeMs:
          type: integer
          minimum: 0
        lastRebalanceAt:
          $ref: '#/components/schemas/Timestamp'
        lastRebalanceReason:
          $ref: '#/components/schemas/WorkerPoolDecisionReason'
        scaleUpPressureStreak:
          type: integer
          minimum: 0
        scaleDownPressureStreak:
          type: integer
          minimum: 0
        scaleUpCooldownRemainingMs:
          type: integer
          minimum: 0
        scaleDownCooldownRemainingMs:
          type: integer
          minimum: 0
        recentDecisions:
          type: array
          items:
            $ref: '#/components/schemas/WorkerPoolDecision'
      additionalProperties: false
    HealthChecks:
      type: object
      required: [postgres, redisEvents, redisRunQueue]
      properties:
        postgres:
          $ref: '#/components/schemas/HealthCheckStatus'
        redisEvents:
          $ref: '#/components/schemas/HealthCheckStatus'
        redisRunQueue:
          $ref: '#/components/schemas/HealthCheckStatus'
      additionalProperties: false
    HealthWorker:
      type: object
      required: [mode, sessionSerialBoundary, localSlots, activeWorkers, summary, pool]
      properties:
        mode:
          $ref: '#/components/schemas/WorkerMode'
        sessionSerialBoundary:
          type: string
          enum: [session]
        localSlots:
          type: array
          items:
            $ref: '#/components/schemas/WorkerSlot'
        activeWorkers:
          type: array
          items:
            $ref: '#/components/schemas/WorkerLease'
        summary:
          $ref: '#/components/schemas/WorkerSummary'
        pool:
          oneOf:
            - $ref: '#/components/schemas/WorkerPool'
            - type: 'null'
      additionalProperties: false
    SandboxTopology:
      type: object
      required: [provider, executionModel, workerPlacement]
      properties:
        provider:
          type: string
          enum: [embedded, self_hosted, e2b]
        executionModel:
          type: string
          enum: [local_embedded, sandbox_hosted]
        workerPlacement:
          type: string
          enum: [api_process, inside_sandbox]
      additionalProperties: false
    HealthReport:
      type: object
      required: [status, storage, process, sandbox, checks, worker]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        storage:
          $ref: '#/components/schemas/HealthStorage'
        process:
          $ref: '#/components/schemas/RuntimeProcess'
        sandbox:
          $ref: '#/components/schemas/SandboxTopology'
        checks:
          $ref: '#/components/schemas/HealthChecks'
        worker:
          $ref: '#/components/schemas/HealthWorker'
      additionalProperties: false
    ReadinessReport:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          $ref: '#/components/schemas/HealthChecks'
      additionalProperties: false
    SystemCapabilities:
      type: object
      required:
        - localDaemonControl
        - localWorkspacePaths
        - workspaceRegistration
        - storageInspection
        - modelManagement
        - localDaemonSupervisor
      properties:
        localDaemonControl:
          type: boolean
        localWorkspacePaths:
          type: boolean
        workspaceRegistration:
          type: boolean
        storageInspection:
          type: boolean
        modelManagement:
          type: boolean
        localDaemonSupervisor:
          type: boolean
      additionalProperties: false
    SystemProfile:
      type: object
      required:
        - apiCompatibility
        - product
        - edition
        - runtimeMode
        - deploymentKind
        - displayName
        - capabilities
      properties:
        apiCompatibility:
          type: string
          enum: [oah/v1]
        product:
          type: string
          enum: [open-agent-harness]
        edition:
          type: string
          enum: [enterprise, personal]
        runtimeMode:
          type: string
          enum: [daemon, embedded, compose, kubernetes, split]
        deploymentKind:
          type: string
          enum: [oah, oap]
        displayName:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/SystemCapabilities'
      additionalProperties: false
    WorkspaceRuntime:
      type: object
      required: [name]
      properties:
        name:
          type: string
    WorkspaceRuntimeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceRuntime'
    WorkspaceRuntimeUploadResponse:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ModelProvider:
      type: object
      required:
        - id
        - packageName
        - description
        - requiresUrl
        - useCases
      properties:
        id:
          type: string
          enum: [openai, openai-compatible, deepseek, moonshotai]
        packageName:
          type: string
        description:
          type: string
        requiresUrl:
          type: boolean
        useCases:
          type: array
          items:
            type: string
      additionalProperties: false
    ModelProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelProvider'
      additionalProperties: false
    Workspace:
      type: object
      required:
        - id
        - name
        - rootPath
        - executionPolicy
        - status
        - kind
        - readOnly
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        externalRef:
          type: string
        name:
          type: string
        runtime:
          type: string
          description: Preferred field for the workspace runtime name.
        rootPath:
          type: string
        executionPolicy:
          type: string
          enum: [local, container, remote_runner]
        status:
          type: string
          enum: [active, archived, disabled]
        kind:
          type: string
          enum: [project]
        readOnly:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        nextCursor:
          type: string
    Sandbox:
      type: object
      required:
        - id
        - workspaceId
        - provider
        - executionModel
        - workerPlacement
        - rootPath
        - name
        - kind
        - executionPolicy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        workspaceId:
          type: string
        provider:
          type: string
          enum: [embedded, self_hosted, e2b]
        executionModel:
          type: string
          enum: [local_embedded, sandbox_hosted]
        workerPlacement:
          type: string
          enum: [api_process, inside_sandbox]
        rootPath:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [project]
        executionPolicy:
          type: string
          enum: [local, container, remote_runner]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        ownerWorkerId:
          type: string
        ownerBaseUrl:
          type: string
    WorkspaceEntry:
      type: object
      required:
        - path
        - name
        - type
        - readOnly
      properties:
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [file, directory]
        sizeBytes:
          type: integer
          minimum: 0
        mimeType:
          type: string
        etag:
          type: string
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        readOnly:
          type: boolean
      additionalProperties: false
    WorkspaceEntryPage:
      type: object
      required:
        - workspaceId
        - path
        - items
      properties:
        workspaceId:
          type: string
        path:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEntry'
        nextCursor:
          type: string
      additionalProperties: false
    WorkspaceFileContent:
      type: object
      required:
        - workspaceId
        - path
        - encoding
        - content
        - truncated
        - readOnly
      properties:
        workspaceId:
          type: string
        path:
          type: string
        encoding:
          type: string
          enum: [utf8, base64]
        content:
          type: string
        truncated:
          type: boolean
        sizeBytes:
          type: integer
          minimum: 0
        mimeType:
          type: string
        etag:
          type: string
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        readOnly:
          type: boolean
      additionalProperties: false
    WorkspaceDeleteResult:
      type: object
      required:
        - workspaceId
        - path
        - type
        - deleted
      properties:
        workspaceId:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, directory]
        deleted:
          type: boolean
      additionalProperties: false
    SandboxFileStat:
      type: object
      required:
        - kind
        - size
        - mtimeMs
        - birthtimeMs
        - path
      properties:
        kind:
          type: string
          enum: [file, directory]
        size:
          type: integer
          minimum: 0
        mtimeMs:
          type: number
          minimum: 0
        birthtimeMs:
          type: number
          minimum: 0
        path:
          type: string
