          type: string
        agentName:
          type: string
          description: Optional agent context to associate with this action run
        input:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
      additionalProperties: false
    ModelGenerateRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          description: Platform model name from the server models directory
        prompt:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
        maxTokens:
          type: integer
          minimum: 1
      additionalProperties: false
      anyOf:
        - required: [prompt]
        - required: [messages]
    ModelStreamRequest:
      allOf:
        - $ref: '#/components/schemas/ModelGenerateRequest'
    ModelGenerateResponse:
      type: object
      required:
        - model
        - text
      properties:
        model:
          type: string
        text:
          type: string
        finishReason:
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      additionalProperties: false
    ActionRunAccepted:
      type: object
      required:
        - runId
        - status
        - actionName
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [queued]
        actionName:
          type: string
        sessionId:
          type: string
    CancelRunAccepted:
      type: object
      required:
        - runId
        - status
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [cancellation_requested]
    GuideQueuedRunAccepted:
      type: object
      required:
        - runId
        - status
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [interrupt_requested]
    RequeueRunAccepted:
      type: object
      required:
        - runId
        - status
        - previousStatus
        - source
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [queued]
        previousStatus:
          type: string
          enum: [failed, timed_out]
        source:
          type: string
          enum: [manual_requeue]
    BatchRequeueRunsRequest:
      type: object
      required: [runIds]
      properties:
        runIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            minLength: 1
      additionalProperties: false
    BatchRequeueRunsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/RequeueRunAccepted'
              - type: object
                required: [runId, status, errorCode, errorMessage]
                properties:
                  runId:
                    type: string
                  status:
                    type: string
                    enum: [error]
                  errorCode:
                    type: string
                  errorMessage:
                    type: string
                additionalProperties: false
    StorageRedisMaintenanceRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
      additionalProperties: false
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: '#/components/schemas/JsonObject'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
