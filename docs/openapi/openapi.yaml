      description: |
        Lists session messages in chronological order.
        Use `direction=backward` to page from the latest message toward older history.
        `cursor` is an opaque keyset cursor derived from message position.
        Use `view=transcript` to return API Message objects after transcript projection.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
