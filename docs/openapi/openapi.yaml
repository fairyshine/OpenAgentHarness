openapi: 3.1.0
info:
  title: Open Agent Harness API
  version: 0.0.1
  summary: Headless distributed agent runtime API
  description: >
    Open Agent Harness is a headless agent runtime for multi-workspace,
    distributed usage. Identity, membership, and authentication are expected
    to be managed by an external service or upstream gateway. This document
    defines the HTTP API for workspace management, session messaging, run
    lifecycle, action invocation, and SSE event streaming.
servers:
  - url: http://localhost:8787/api/v1
    description: Local development
tags:
  - name: Workspaces
    description: >
      Workspace identity, catalog, lifecycle, and metadata APIs. This surface
      remains part of the public contract even though file and command flows
      are sandbox-scoped.
  - name: Sandboxes
    description: >
      Active execution-copy APIs. Sandbox semantics intentionally align with
      E2B, so file and command flows stay rooted under /sandboxes and expose
      /workspace as the in-sandbox root.
  - name: Files
    description: >
      File APIs operate on sandbox-scoped execution copies rather than
      workspace metadata. The /sandboxes + /workspace shape is a deliberate
      compatibility contract with E2B, not a temporary shim. The /workspaces
      API still remains for metadata, catalog, and lifecycle concerns.
  - name: Commands
    description: >
      Command execution APIs run inside the active sandbox context and follow
      the same sandbox-scoped contract as the file APIs.
  - name: Catalog
  - name: Models
  - name: System
  - name: Sessions
  - name: Messages
  - name: Runs
  - name: Actions
  - name: Events
  - name: Storage
paths:
  /healthz:
    get:
      tags: [Events]
      summary: Health report
      operationId: getHealthReport
      responses:
        '200':
          description: Process health and worker execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /readyz:
    get:
      tags: [Events]
      summary: Readiness report
      operationId: getReadinessReport
      responses:
        '200':
          description: Process is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          description: Process is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
  /system/profile:
    get:
      tags: [System]
      summary: Get server deployment profile
      operationId: getSystemProfile
      responses:
        '200':
          description: OAH-compatible server profile and client capability flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemProfile'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /runtimes:
    get:
      tags: [Workspaces]
      summary: List workspace runtimes
      operationId: listWorkspaceRuntimes
      responses:
        '200':
          description: Workspace runtime list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRuntimeList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /runtimes/upload:
    post:
      tags: [Workspaces]
      summary: Upload workspace runtime
      operationId: uploadWorkspaceRuntime
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: overwrite
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Workspace runtime uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRuntimeUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /runtimes/{runtimeName}:
    put:
      tags: [Workspaces]
      summary: Update workspace runtime
      operationId: updateWorkspaceRuntime
      parameters:
        - in: path
          name: runtimeName
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Workspace runtime updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRuntimeUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Workspaces]
      summary: Delete workspace runtime
      operationId: deleteWorkspaceRuntime
      parameters:
        - in: path
          name: runtimeName
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: Workspace runtime deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /blueprints:
    get:
      tags: [Workspaces]
      summary: List workspace runtimes (legacy alias)
      operationId: listWorkspaceBlueprints
      deprecated: true
      responses:
        '200':
          description: Workspace runtime list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRuntimeList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /blueprints/upload:
    post:
      tags: [Workspaces]
      summary: Upload workspace runtime (legacy alias)
      operationId: uploadWorkspaceBlueprint
      deprecated: true
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: overwrite
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Workspace runtime uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRuntimeUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /blueprints/{runtimeName}:
    put:
      tags: [Workspaces]
      summary: Update workspace runtime (legacy alias)
      operationId: updateWorkspaceBlueprint
      deprecated: true
      parameters:
        - name: runtimeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Workspace runtime updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRuntimeUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Workspaces]
      summary: Delete workspace runtime (legacy alias)
      operationId: deleteWorkspaceBlueprint
      deprecated: true
      parameters:
        - name: runtimeName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Workspace runtime deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /model-providers:
    get:
      tags: [Models]
      summary: List supported model providers
      operationId: listModelProviders
      responses:
        '200':
          description: Supported model provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProviderList'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /platform-models:
    get:
      tags: [Models]
      summary: List discovered platform models
      operationId: listPlatformModels
      responses:
        '200':
          description: Platform model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /platform-models/refresh:
    post:
      tags: [Models]
      summary: Refresh platform model metadata
      operationId: refreshPlatformModels
      responses:
        '200':
          description: Platform model snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /platform-models/refresh/distributed:
    post:
      tags: [Models]
      summary: Refresh platform model metadata across workers
      operationId: refreshPlatformModelsDistributed
      responses:
        '200':
          description: Distributed refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /platform-models/events:
    get:
      tags: [Models, Events]
      summary: Subscribe to platform model metadata updates
      operationId: streamPlatformModelEvents
      responses:
        '200':
          description: Server-Sent Events stream of platform model snapshots
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Workspace page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Workspaces]
      summary: Create workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/import:
    post:
      tags: [Workspaces]
      summary: Import an existing workspace directory
      operationId: importWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceImportRequest'
      responses:
        '201':
          description: Workspace imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /local/workspaces/register:
    post:
      tags: [Workspaces]
      summary: Register a local workspace path
      operationId: registerLocalWorkspace
      description: >
        Personal deployment endpoint for OAP local daemons. Servers must only
        enable this when their system profile advertises local workspace path
        registration capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLocalWorkspaceRequest'
      responses:
        '201':
          description: Local workspace registered or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /local/workspaces/{workspaceId}/repair:
    post:
      tags: [Workspaces]
      summary: Repair a local workspace path
      operationId: repairLocalWorkspace
      description: >
        Personal deployment endpoint for OAP local daemons. Rebinds an existing
        workspace id to a moved or renamed local repo path while preserving
        session, run, and message history associated with that workspace id.
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairLocalWorkspaceRequest'
      responses:
        '200':
          description: Local workspace path repaired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Workspaces]
      summary: Delete workspace
      operationId: deleteWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Workspace deleted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/catalog:
    get:
      tags: [Catalog]
      summary: Get workspace catalog
      operationId: getWorkspaceCatalog
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace-discovered capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCatalog'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory/status:
    get:
      tags: [Workspaces]
      summary: Get workspace memory status
      operationId: getWorkspaceMemoryStatus
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace memory status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory:
    get:
      tags: [Workspaces]
      summary: List workspace memory index
      operationId: listWorkspaceMemory
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace memory index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory/search:
    get:
      tags: [Workspaces]
      summary: Search workspace memory
      operationId: searchWorkspaceMemory
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: corpus
          in: query
          required: false
          schema:
            type: string
            enum: [all, index, topics, sessions, daily, dreams]
            default: all
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Workspace memory search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory/read:
    get:
      tags: [Workspaces]
      summary: Read a workspace memory file slice
      operationId: readWorkspaceMemory
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/EntryPathQuery'
        - name: from
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Workspace memory file content slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory/proposals:
    get:
      tags: [Workspaces]
      summary: List workspace memory proposals
      operationId: listWorkspaceMemoryProposals
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace memory proposal page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory/proposals/apply:
    post:
      tags: [Workspaces]
      summary: Apply a workspace memory proposal
      operationId: applyWorkspaceMemoryProposal
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Proposal action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/memory/proposals/reject:
    post:
      tags: [Workspaces]
      summary: Reject a workspace memory proposal
      operationId: rejectWorkspaceMemoryProposal
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 220
      responses:
        '200':
          description: Proposal action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/entries:
    get:
      tags: [Files]
      summary: List workspace directory entries
      operationId: listWorkspaceEntries
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/DirectoryPathQuery'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntrySortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Workspace entry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntryPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Files]
      summary: Delete a workspace file or directory
      operationId: deleteWorkspaceEntry
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/EntryPathQuery'
        - $ref: '#/components/parameters/Recursive'
      responses:
        '200':
          description: Workspace entry deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeleteResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/entries/move:
    patch:
      tags: [Files]
      summary: Move or rename a workspace entry
      operationId: moveWorkspaceEntry
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveWorkspaceEntryRequest'
      responses:
        '200':
          description: Entry moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/files/content:
    get:
      tags: [Files]
      summary: Read workspace file content
      operationId: getWorkspaceFileContent
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/EntryPathQuery'
        - $ref: '#/components/parameters/FileEncoding'
        - $ref: '#/components/parameters/MaxBytes'
      responses:
        '200':
          description: Workspace file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileContent'
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Files]
      summary: Write workspace file content
      operationId: putWorkspaceFileContent
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutWorkspaceFileRequest'
      responses:
        '200':
          description: Workspace file written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/files/upload:
    put:
      tags: [Files]
      summary: Upload raw bytes to a workspace file
      operationId: uploadWorkspaceFile
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/EntryPathQuery'
        - $ref: '#/components/parameters/UploadOverwrite'
        - $ref: '#/components/parameters/UploadIfMatch'
        - $ref: '#/components/parameters/UploadMtimeMs'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Workspace file uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/files/download:
    get:
      tags: [Files]
      summary: Download raw workspace file bytes
      operationId: downloadWorkspaceFile
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/EntryPathQuery'
      responses:
        '200':
          description: Raw file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ErrorResponse'
  /workspaces/{workspaceId}/directories:
    post:
      tags: [Files]
      summary: Create a workspace directory
      operationId: createWorkspaceDirectory
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceDirectoryRequest'
      responses:
        '200':
          description: Directory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sandboxes:
    post:
      tags: [Sandboxes]
      summary: Ensure a workspace-backed sandbox
      operationId: ensureSandboxForWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureSandboxForWorkspaceRequest'
      responses:
        '200':
          description: Existing sandbox resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sandboxes/{sandboxId}:
    get:
      tags: [Sandboxes]
      summary: Get sandbox metadata
      operationId: getSandbox
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Sandbox metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sandboxes/{sandboxId}/files/entries:
    get:
      tags: [Files]
      summary: List direct children of a sandbox directory
      operationId: listSandboxEntries
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/DirectoryPathQuery'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntrySortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Directory entry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntryPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sandboxes/{sandboxId}/files/stat:
    get:
      tags: [Files]
      summary: Read sandbox file or directory metadata
      operationId: getSandboxFileStat
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/EntryPathQuery'
      responses:
        '200':
          description: File or directory metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxFileStat'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sandboxes/{sandboxId}/files/entry:
    delete:
      tags: [Files]
      summary: Delete a sandbox file or directory
      operationId: deleteSandboxEntry
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/EntryPathQuery'
        - $ref: '#/components/parameters/Recursive'
      responses:
        '200':
          description: Entry deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeleteResult'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /sandboxes/{sandboxId}/files/move:
    patch:
      tags: [Files]
      summary: Rename or move a sandbox file or directory
      operationId: moveSandboxEntry
      parameters:
